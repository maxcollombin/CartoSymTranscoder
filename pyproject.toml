[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cartosym-transcoder"
version = "0.1.0"
authors = [
    {name = "Maxime Collombin", email = "maxime.collombin@netplus.ch"},
]
description = "Lossless transcoding between CartoSym CSS and other encodings for OGC Style & Symbology"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]
keywords = ["gis", "cartography", "symbology", "ogc", "sld", "cartosym"]
dependencies = [
    "antlr4-python3-runtime>=4.13.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "antlr4-tools>=0.2.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black",
    "ruff>=0.6",
    "mypy",
    "xmlschema>=3.0",
]
sld = [
    "lxml>=4.9.0",
]
maplibre = []
cql2 = [
    "pygeofilter>=0.2.0",
]
all = [
    "cartosym-transcoder[dev,sld,cql2]",
]

[project.urls]
Homepage = "https://github.com/maxcollombin/CartoSymTranscoder"
Documentation = "https://github.com/maxcollombin/CartoSymTranscoder/blob/main/README.md"
Repository = "https://github.com/maxcollombin/CartoSymTranscoder.git"
Issues = "https://github.com/maxcollombin/CartoSymTranscoder/issues"

[project.scripts]
cartosym = "cartosym_transcoder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cartosym_transcoder = ["*.md", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313', 'py314']
extend-exclude = 'src/cartosym_transcoder/grammar/generated'

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["src/cartosym_transcoder/grammar/generated"]

[tool.ruff.lint]
# E/F/W: flake8 parity. I: isort parity. UP: pyupgrade (safe on the
# >=3.10 floor — PEP 604/585 syntax). FIX/TD: no stray TODO/FIXME/HACK
# left in the tree — a known gap raises NotImplementedError with an inline
# reason instead. D: pydocstyle (google convention). The undocumented-*
# rules are enforced in `src/` (real public API) but not in `tests/` —
# a test's name is its spec (per-file-ignores below). Still staged in as
# a follow-up: D205 (blank line after summary) / D415 (terminal
# punctuation) / D403 (first-word case) — a naive autofix splits wrapped
# summaries and mangles identifiers like `stylingRuleName`, so these need
# a sentence-aware manual pass. ERA (commented-out code) is a separate
# follow-up.
select = ["E", "F", "W", "I", "UP", "FIX", "TD", "D"]
ignore = ["D205", "D400", "D401", "D403", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names document the behaviour under test; no docstring mandate.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.isort]
known-first-party = ["cartosym_transcoder"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["^src/cartosym_transcoder/grammar/generated/"]
